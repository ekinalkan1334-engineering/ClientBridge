
name: ClientBridge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clientbridge
          POSTGRES_PASSWORD: clientbridge
          POSTGRES_DB: clientbridge_concurrency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clientbridge -d clientbridge_concurrency_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: clientbridge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clientbridge/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run automated tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://clientbridge:clientbridge@localhost:5432/clientbridge_concurrency_test
        run: python -m pytest -q
